name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MCBE_REQUIRE_CROSS_LANGUAGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: addon/package-lock.json}
      - run: python -m pip install -e ".[dev,release]" "twine>=7"
      - run: npm ci
        working-directory: addon
      - run: pytest -p no:cacheprovider --cov=mcbe_ws_sdk --cov-report=term-missing -q
      - run: python tools/generate_v2_assets.py --check
      - run: python tools/check_protocol_names.py
      - run: ruff check --no-cache src tests examples tools
      - run: mypy --no-incremental src
      - run: >-
          cp .env.example .env && npm test && npm run lint && npm run typecheck
          && npm run build:production && npm run build:demo && npm run mcaddon:demo
        working-directory: addon
      - name: Verify tag matches package version
        env: {TAG: "${{ github.ref_name }}"}
        run: python tools/check_release_tag.py "$TAG"
      - run: python -m build --sdist --wheel
      - run: twine check dist/* && python tools/check_dist.py dist
      - run: python -m pip wheel --no-deps dist/*.tar.gz -w /tmp/rebuilt
      - name: Probe installed candidate outside the checkout
        env:
          PYTHONPATH: ""
        run: |
          python -m venv /tmp/mcbe-contract-venv
          /tmp/mcbe-contract-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/mcbe-contract-venv/bin/python "$GITHUB_WORKSPACE/tools/probe_installed_contract.py"
      - uses: actions/upload-artifact@v4
        with: {name: python-dist, path: dist/*, if-no-files-found: error}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: python-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1
