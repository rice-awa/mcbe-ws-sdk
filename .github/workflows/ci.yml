name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --no-cache src tests examples tools
      - run: mypy --no-incremental src
      - run: python tools/generate_v2_assets.py --check
      - run: python tools/check_protocol_names.py
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {python: ["3.11", "3.12", "3.13", "3.14"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -p no:cacheprovider --cov=mcbe_ws_sdk --cov-report=term-missing -q
  cross-language:
    runs-on: ubuntu-latest
    env:
      MCBE_REQUIRE_CROSS_LANGUAGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: addon/package-lock.json}
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: addon
      - run: >-
          python -m pytest -p no:cacheprovider -q
          tests/unit/test_v2_codec.py tests/unit/test_v2_transport.py
          tests/unit/test_v2_contract.py tests/unit/test_v2_tooling.py
          tests/unit/test_v2_review_regressions.py
          tests/unit/test_v2_runtime.py tests/unit/test_v2_negotiation.py
          tests/unit/test_v2_streams.py tests/unit/test_example_behavior.py
  websockets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {websockets: ["~=12.0", "~=14.0", "~=16.0"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e ".[dev]" "websockets${{ matrix.websockets }}"
      - run: pytest -p no:cacheprovider tests/unit/test_server_facade.py tests/unit/test_delivery.py tests/unit/test_server_entry.py -q
  addon:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: addon}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: addon/package-lock.json}
      - run: npm ci
      - run: cp .env.example .env
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:production
      - run: npm run build:base
      - run: npm run mcaddon
      - run: npm run mcaddon:base
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with: {name: docs-site, path: site/, if-no-files-found: error}
  dist:
    needs: [quality, python, cross-language, websockets, addon, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e ".[dev,release]" "twine>=7"
      - run: python -m build --sdist --wheel
      - run: twine check dist/*
      - run: python tools/check_dist.py dist
      - run: python -m pip wheel --no-deps dist/*.tar.gz -w /tmp/rebuilt
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import mcbe_ws_sdk; print(mcbe_ws_sdk.__version__)"
      - uses: actions/upload-artifact@v4
        with: {name: python-dist, path: dist/*, if-no-files-found: error}
  contract:
    needs: [dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {name: python-dist, path: /tmp/mcbe-ws-sdk-dist}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "twine>=7"
      - run: python -m venv /tmp/mcbe-ws-sdk-contract-venv
      - run: /tmp/mcbe-ws-sdk-contract-venv/bin/pip install /tmp/mcbe-ws-sdk-dist/*.whl
      - run: python -m twine check /tmp/mcbe-ws-sdk-dist/*
      - run: python tools/check_dist.py /tmp/mcbe-ws-sdk-dist
      - name: Probe the installed wheel outside the checkout
        env:
          PYTHONPATH: ""
        run: |
          mkdir -p /tmp/mcbe-ws-sdk-contract-cwd
          cd /tmp/mcbe-ws-sdk-contract-cwd
          /tmp/mcbe-ws-sdk-contract-venv/bin/python "$GITHUB_WORKSPACE/tools/probe_installed_contract.py"
